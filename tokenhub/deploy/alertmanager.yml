global:
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alertmanager@tokenhub.com'
  smtp_auth_username: 'alertmanager@tokenhub.com'
  smtp_auth_password: 'your-password'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'admin@tokenhub.com'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@tokenhub.com'
        send_resolved: true
        html: |
          <h2>🚨 严重告警</h2>
          <p><strong>告警名称:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>严重程度:</strong> {{ .CommonLabels.severity }}</p>
          <p><strong>摘要:</strong> {{ .CommonAnnotations.summary }}</p>
          <p><strong>详情:</strong> {{ .CommonAnnotations.description }}</p>
          <p><strong>开始时间:</strong> {{ .StartsAt }}</p>

  - name: 'warning-alerts'
    email_configs:
      - to: 'dev-team@tokenhub.com'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
